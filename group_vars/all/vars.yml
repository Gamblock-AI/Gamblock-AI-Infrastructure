---
# Non-sensitive variables (plain text). Secrets live in vault.yml.

# ---- GitHub Container Registry ----
github_registry: "ghcr.io"
github_registry_username: "Alfian57"

# ---- Domains ----
primary_domain: "gamblock-ai.com"
www_domain: "www.gamblock-ai.com"
api_domain: "api.gamblock-ai.com"

# ---- Application ports (internal container ports) ----
gamblock_ai_backend_port: 8080
gamblock_ai_website_port: 3000

# ---- Docker stack paths ----
docker_stack_base: "/opt/docker-stack"
docker_stack_applications: "{{ docker_stack_base }}/applications"

# ---- Docker networks ----
proxy_network: "gamblock_proxy_network"
postgres_network: "postgres_network"

# ---- Caddy ----
caddy_image: "caddy:2.11.4-alpine"

# ---- PostgreSQL ----
postgres_image: "postgres:16-alpine"
postgres_container_name: "postgres-db"
postgres_port: 5432
gamblock_db_name: "gamblock"
gamblock_db_username: "gamblock"
postgres_backup_retention_days: 14

# ---- Backend media policy ----
# Exact HTTPS hosts accepted by the backend education-media gate. The website
# ships the matching public-origin fallback in its build.
media_embed_allowed_hosts:
  - "www.youtube-nocookie.com"
  - "player.vimeo.com"
  - "who.int"
  - "www.who.int"
  - "ppatk.go.id"
  - "www.ppatk.go.id"
  - "ojk.go.id"
  - "www.ojk.go.id"
  - "komdigi.go.id"
  - "www.komdigi.go.id"
  - "kemkes.go.id"
  - "www.kemkes.go.id"

# ---- DeepSeek-backed supporting features ----
# The API key is stored under vault_gamblock_backend.deepseek_api_key.
deepseek_base_url: "https://api.deepseek.com"
deepseek_model: "deepseek-v4-flash"
spk_llm_enrichment: true

# ---- Web Push (daily reminder) ----
# Public VAPID key (the matching private key lives in the encrypted vault).
# Baked into the website build as NEXT_PUBLIC_VAPID_PUBLIC_KEY and rendered in
# the backend .env.j2 as VAPID_PUBLIC_KEY.
vapid_public_key: "BJa71prmSZVxNWcWczYLgXi2PWnniFjc_Fv83CvLD3vnRT0f0fU_VgdBwJW7NFaXtXnorE_6KY0F28XWVYkMXyc"
vapid_subject: "mailto:support@gamblock-ai.com"

# ---- Role toggles ----
enable_system: true
enable_docker: true
enable_postgres: true
enable_gamblock_ai_backend: true
enable_gamblock_ai_website: true
enable_caddy: true

# ---- GitHub (org repos for CI secrets/variables) ----
github_owner: "Gamblock-AI"
# drone-ssh uses Go's host-key preference and negotiates this trusted ECDSA key.
vps_host_fingerprint: "SHA256:x/P+AsSszaRkiln4N3Y4wTaLnJIvnAJBBPPuTQwaxd4"
github_repos:
  - "Gamblock-AI-Backend"
  - "Gamblock-AI-Website"
  - "Gamblock-AI-Apps"

# Production bootstrap is complete; CI deploy remains explicitly enabled.
github_enable_vps_deploy: "true"
github_enable_production_release: "false"

# ---- Flutter public environment configuration ----
flutter_development_api_url: "https://thankful-midge-noble.ngrok-free.app"
flutter_production_api_url: "https://api.gamblock-ai.com"
flutter_web_base_url: "https://gamblock-ai.com"

# ---- Cloudflare DNS ----
cloudflare_zone_name: "gamblock-ai.com"
cloudflare_records:
  - name: "@"
    type: "A"
    proxied: true
  - name: "www"
    type: "A"
    proxied: true
  - name: "api"
    type: "A"
    proxied: true
