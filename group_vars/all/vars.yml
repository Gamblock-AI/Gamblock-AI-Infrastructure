---
# Non-sensitive variables shared by every environment (plain text). Secrets
# live in vault.yml. Environment-specific values (app catalog overrides,
# domains, database name, backend runtime flags, and the seeding plan) live in
# group_vars/environments/{production,staging}.yml.

# ---- GitHub Container Registry ----
github_registry: "ghcr.io"
github_registry_username: "Alfian57"

# ---- Domains (both environments; Caddy renders every site from here) ----
production_primary_domain: "gamblock-ai.com"
production_www_domain: "www.gamblock-ai.com"
production_api_domain: "api.gamblock-ai.com"
staging_primary_domain: "staging.gamblock-ai.com"
# Single-label subdomain: the Cloudflare Free-plan Universal SSL certificate
# covers only `gamblock-ai.com` and `*.gamblock-ai.com`, so the staging API
# must stay a one-label hostname (`api.staging.*` would have no edge cert).
staging_api_domain: "api-staging.gamblock-ai.com"

# ---- Application ports (internal container ports; identical across
# environments because each container has its own network namespace) ----
gamblock_ai_backend_port: 8080
gamblock_ai_website_port: 3000

# ---- Container names used by Caddy routing and one-shot tooling ----
gamblock_ai_backend_container: "gamblock-ai-backend"
gamblock_ai_backend_staging_container: "gamblock-ai-backend-staging"
gamblock_ai_website_container: "gamblock-ai-website"
gamblock_ai_website_staging_container: "gamblock-ai-website-staging"

# ---- Docker stack paths ----
docker_stack_base: "/opt/docker-stack"
docker_stack_applications: "{{ docker_stack_base }}/applications"

# ---- Docker networks ----
proxy_network: "gamblock_proxy_network"
postgres_network: "postgres_network"

# ---- Caddy ----
caddy_image: "caddy:2.11.4-alpine"

# ---- PostgreSQL (one shared container, two databases) ----
postgres_image: "postgres:16-alpine"
postgres_container_name: "postgres-db"
postgres_port: 5432
postgres_default_db_name: "gamblock"
staging_db_name: "gamblock_staging"
gamblock_db_username: "gamblock"
postgres_backup_retention_days: 14

# ---- Backend media policy ----
# Exact HTTPS hosts accepted by the backend education-media gate. The website
# ships the matching public-origin fallback in its build.
media_embed_allowed_hosts:
  - "www.youtube-nocookie.com"
  - "player.vimeo.com"
  - "who.int"
  - "www.who.int"
  - "ppatk.go.id"
  - "www.ppatk.go.id"
  - "ojk.go.id"
  - "www.ojk.go.id"
  - "komdigi.go.id"
  - "www.komdigi.go.id"
  - "kemkes.go.id"
  - "www.kemkes.go.id"

# ---- DeepSeek-backed supporting features ----
# The API key is stored under vault_gamblock_backend.deepseek_api_key.
deepseek_base_url: "https://api.deepseek.com"
deepseek_model: "deepseek-v4-flash"
spk_llm_enrichment: true

# ---- Device-bound protection grants ----
# The matching private key is stored in the encrypted vault. This public trust
# store is base64(JSON {kid: base64-DER-SPKI-P256}) and is compiled into the
# Android/Windows native verifiers; it never contains a secret.
protection_grant_signing_key_id: "grant-2026-01"
protection_grant_trust_store_base64: "eyJncmFudC0yMDI2LTAxIjoiTUZrd0V3WUhLb1pJemowQ0FRWUlLb1pJemowREFRY0RRZ0FFNTR6MnljeCtNeVFjUXBkNW1jb3d3QUM4ejlJQjNWbGtPNExUUkVCTnhxck5lS1Q3bkY1UVQ3YW5uaml1dCtRRDhuSkNrS0NKamdydUlCbkNpbkF4TWc9PSJ9"

# ---- Web Push (daily reminder) ----
# Public VAPID key (the matching private key lives in the encrypted vault).
# Baked into the website build as NEXT_PUBLIC_VAPID_PUBLIC_KEY and rendered in
# the backend .env.j2 as VAPID_PUBLIC_KEY.
vapid_public_key: "BJa71prmSZVxNWcWczYLgXi2PWnniFjc_Fv83CvLD3vnRT0f0fU_VgdBwJW7NFaXtXnorE_6KY0F28XWVYkMXyc"
vapid_subject: "mailto:support@gamblock-ai.com"

# ---- Role toggles ----
enable_system: true
enable_docker: true
enable_postgres: true
enable_gamblock_ai_backend: true
enable_gamblock_ai_website: true
enable_caddy: true

# ---- GitHub (org repos for CI secrets/variables) ----
github_owner: "Gamblock-AI"
# drone-ssh uses Go's host-key preference and negotiates this trusted ECDSA key.
vps_host_fingerprint: "SHA256:x/P+AsSszaRkiln4N3Y4wTaLnJIvnAJBBPPuTQwaxd4"
github_repos:
  - "Gamblock-AI-Backend"
  - "Gamblock-AI-Website"
  - "Gamblock-AI-Apps"

# Production bootstrap is complete. GitHub-hosted runners cannot reliably
# reach the password-authenticated SSH endpoint, so application deployment is
# performed through the authorized local `make deploy` path.
github_enable_vps_deploy: "false"
github_enable_production_release: "true"
github_enable_windows_pilot_release: "false"

# ---- Flutter public environment configuration ----
flutter_development_api_url: "https://thankful-midge-noble.ngrok-free.app"
flutter_production_api_url: "https://api.gamblock-ai.com"
flutter_web_base_url: "https://gamblock-ai.com"

# ---- Cloudflare DNS ----
cloudflare_zone_name: "gamblock-ai.com"
cloudflare_records:
  - name: "@"
    type: "A"
    proxied: true
  - name: "www"
    type: "A"
    proxied: true
  - name: "api"
    type: "A"
    proxied: true
  - name: "staging"
    type: "A"
    proxied: true
  - name: "api-staging"
    type: "A"
    proxied: true
